<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Classement Eurosport</title>
<meta name="theme-color" content="#0A1226">
<meta name="application-name" content="Classement Eurosport">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Classement">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Mise en page : application mobile sombre, barre de navigation basse (esprit MPP).
   Couleurs : bleu nuit et rouge de l'identité Eurosport, or réservé au leader et aux points.
   Détail propre au sujet : dix étoiles, une par place du classement, qui s'allument à chaque révélation. */
:root{
  --bg:#0A1226; --bg2:#101B38; --surface:#14204A; --surface2:#1A2A5A; --line:#263764; --text:#F2F5FC; --muted:#9AA8CE;
  --blue:#1F6FEB; --blue-ink:#FFFFFF; --gold:#E2B94E; --gold-ink:#241A00; --red:#E5484D; --green:#3DDC84;
  --display:'Barlow Condensed','Arial Narrow',Arial,sans-serif; --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);font-weight:700;font-style:italic;text-transform:uppercase;letter-spacing:.02em;text-wrap:balance;margin:0}
h2{font-size:1.7rem;line-height:1.05}
h3{font-size:1.2rem}
p{margin:.4em 0}
.app{max-width:560px;margin:0 auto;padding:0 16px 96px;min-height:100%}

header.top{position:sticky;top:0;z-index:5;margin:0 -16px;padding:10px 16px 10px;background:linear-gradient(180deg,var(--bg2),var(--bg));border-bottom:1px solid var(--line)}
.brand{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand h1{font-size:1.6rem;line-height:1}
.brand small{display:block;font-family:var(--body);font-style:normal;font-size:.66rem;font-weight:600;letter-spacing:.14em;color:var(--muted);margin-top:3px}
.stars{display:flex;gap:2px;font-size:.8rem;line-height:1;flex:none}
.brand>div:first-child{min-width:0;flex:1}
.stars span{color:var(--line)} .stars span.on{color:var(--gold)}
.demo{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;margin-top:8px;font-size:.78rem;color:var(--muted)}
.demo b{color:var(--text);font-weight:600}
input[type=range]{width:100%;accent-color:var(--gold);height:24px;margin:0}

nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg2);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.bottom div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.bottom button{background:none;border:0;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:.68rem;font-weight:600;letter-spacing:.03em}
nav.bottom svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.bottom button[aria-current=page]{color:var(--gold);box-shadow:inset 0 2px 0 var(--gold)}

main{padding-top:18px;display:flex;flex-direction:column;gap:14px}
.sub{color:var(--muted);font-size:.92rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.rowflex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--blue);background:var(--blue);color:var(--blue-ink);padding:11px 18px;border-radius:8px;font-weight:600;letter-spacing:.03em;text-align:center}
.btn.ghost{background:transparent;border-color:var(--muted);color:var(--text)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.btn.block{width:100%}
.btn.small{padding:7px 12px;font-size:.85rem}
.link{background:none;border:0;padding:0;color:var(--gold);font-weight:600;text-decoration:underline;text-underline-offset:3px}
input.field,select.field{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:1rem}
input.field::placeholder{color:#6E7DA6}
label.lab{display:block;font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:2px 0 5px}
.msg{font-size:.88rem;min-height:1.2em}
.msg.err{color:var(--red)} .msg.ok{color:var(--green)}
.note{font-size:.84rem;color:var(--muted)}
.neg{color:var(--red)} .pos{color:var(--green);font-weight:600} .zero{color:var(--muted);font-weight:400}
.sp{display:inline-block;width:1.4em;text-align:center;flex:none}
.pt{border:1px solid var(--line);border-radius:12px;background:var(--bg2);margin:8px 0;padding:8px 8px 9px;position:relative;transition:box-shadow .15s}
.pt1{display:grid;grid-template-columns:34px 2.4ch 1.4em 1fr auto;gap:6px;align-items:center}
.pt .num{font-family:var(--display);font-weight:700;font-size:1.2rem;color:var(--muted);text-align:right}
.pt input,.pt select{width:100%;min-width:0;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:1rem}
.pt input.dup{border-color:var(--red)}
.pt2{display:none;grid-template-columns:7.2em 1fr;gap:6px;margin:7px 0 0 40px}
.pt.filled .pt2{display:grid}
.pt2 select{font-size:.85rem;padding:8px 4px}.pt2 input{font-size:.85rem;font-style:italic}
.grip{touch-action:none;cursor:grab;border:0;background:transparent;color:var(--muted);font-size:1.5rem;line-height:1;height:40px;width:34px;border-radius:8px;user-select:none;-webkit-user-select:none}
.mv{display:flex;gap:4px}.mv button{border:1px solid var(--line);background:transparent;color:inherit;width:34px;height:36px;border-radius:8px;font-size:.8rem;cursor:pointer}.mv button:disabled{opacity:.3}
.pt.reserve{opacity:.8;border-style:dashed}
.pt-sep{margin:14px 0 4px;font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:center}
.pt.dragging{z-index:5;box-shadow:0 10px 28px rgba(0,0,0,.35);opacity:.95;transition:none}
.pt.drop{outline:2px dashed var(--gold);outline-offset:2px}

.badge{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;padding:3px 10px;border-radius:99px;background:var(--surface2);border:1px solid var(--line)}
.badge.admin{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}

.hero{margin:0 -16px;padding:44px 20px 28px;background:radial-gradient(120% 70% at 50% 0%,#2B4EA8 0%,transparent 60%),linear-gradient(180deg,#0E1A3C,var(--bg));text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.hero .stars{font-size:1.4rem;gap:6px}
.hero h1{font-size:2.8rem;line-height:.95}
.hero p{max-width:30ch;margin:0 auto;color:var(--muted)}

.cd{display:flex;align-items:flex-start;justify-content:center;gap:8px;margin-top:8px}
.cd div{display:flex;flex-direction:column;align-items:center;min-width:3.2ch}
.cd b{font-family:var(--display);font-size:2.3rem;line-height:1;font-weight:700}
.cd small{font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.cd i{font-style:normal;font-family:var(--display);font-size:2rem;line-height:1;color:var(--muted)}
.cdcard{text-align:center}
.cdcard p{margin:0;font-size:.9rem;color:var(--muted)}

.slot{display:grid;grid-template-columns:2.2ch 1.5em 1fr;gap:8px;align-items:center;margin:7px 0}
.slot .num{font-family:var(--display);font-weight:700;font-size:1.25rem;color:var(--muted);text-align:right}
.slot input{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:1rem;min-width:0}
.slot input.dup{border-color:var(--red)}
.slot.gm{grid-template-columns:2.2ch 1.5em 1fr 5.2em}
.slot select{width:100%;padding:9px 4px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:.9rem;min-width:0}

.board{display:flex;flex-direction:column;gap:10px;padding:0;margin:0;list-style:none}
.row{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center}
.row.lead{border-left:7px solid var(--gold)}
.row.me{background:var(--surface2)}
.rk{font-family:var(--display);font-weight:700;font-style:italic;font-size:2.1rem;line-height:1;min-width:1.2ch;text-align:center}
.who{display:flex;align-items:center;gap:8px;min-width:0}
.name{background:none;border:0;padding:4px 0;font-weight:600;font-size:1.05rem;text-align:left;overflow-wrap:anywhere}
.mv{font-size:.76rem;font-weight:600;white-space:nowrap}
.mv.up{color:var(--green)} .mv.down{color:var(--red)} .mv.eq{color:var(--muted)}
.tot{font-family:var(--display);font-weight:700;font-size:2.2rem;line-height:1;text-align:right}
.tot small{font-size:.9rem;color:var(--muted);margin-left:3px;font-weight:600}
.row.lead .tot b{box-shadow:inset 0 -.26em 0 rgba(226,185,78,.55)}
.parts{grid-column:1 / -1;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:8px 0 0;padding-top:8px;border-top:1px solid var(--line)}
.parts div{min-width:0}
.parts dt{font-size:.6rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.parts dd{margin:0;font-weight:600;font-size:.95rem}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--surface);padding:6px 14px;border-radius:99px;font-weight:600;font-size:.92rem}
.pill[aria-pressed=true]{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}

.pro{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.avatar{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-style:italic;font-weight:700;font-size:1.7rem;background:var(--surface2);border:3px solid var(--gold)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.92rem;margin-top:12px;align-items:center}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600}
.lg{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.lg:first-of-type{border-top:0}
.lg b{font-weight:600}
.code{font-family:var(--display);font-weight:700;font-size:1.15rem;letter-spacing:.18em;background:var(--bg);border:1px dashed var(--muted);padding:2px 9px;border-radius:6px}
.sn-h{margin:14px 0 8px;font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}.tiles.four{grid-template-columns:repeat(4,1fr)}.tiles.four .num{font-size:20px}.tiles.four small{font-size:12px;color:var(--muted);font-weight:400}
.sn{width:100%;border-collapse:collapse;margin:12px 0 4px;font-size:14px}.sn th,.sn td{padding:7px 4px;text-align:right;border-top:1px solid var(--line)}.sn thead th{border-top:0;color:var(--muted);font-weight:500;font-size:12px}.sn tbody th{text-align:left;font-weight:600}.sn small{color:var(--muted);font-weight:400}.sn td{font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
.tile span{display:block;font-size:.66rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tile b{font-family:var(--display);font-size:1.9rem;line-height:1.1}
.tile.hl{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)} .tile.hl span{color:var(--gold-ink);opacity:.75}
.bar{position:relative;height:14px;border-radius:7px;background:var(--bg);border:1px solid var(--line);margin:12px 0 6px;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;display:block}
.bar .pot{background:rgba(226,185,78,.25)} .bar .proj{background:rgba(226,185,78,.6)} .bar .acq{background:var(--gold)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th{font-size:.64rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:4px 3px;border-bottom:1px solid var(--line);vertical-align:bottom}
th small{display:block;font-size:.6rem;letter-spacing:.02em;text-transform:none;font-weight:500}
td{padding:7px 3px;border-bottom:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right}
td.ath{min-width:0}
tr.pending td{color:var(--muted)}
.tag{font-size:.7rem;font-weight:600;border-radius:5px;padding:1px 6px;background:var(--bg);color:var(--muted);white-space:nowrap}
.tag.ok{background:rgba(61,220,132,.15);color:var(--green)} .tag.ko{background:rgba(229,72,77,.16);color:var(--red)}
ul.plain{margin:6px 0 0;padding-left:18px} ul.plain li{margin:3px 0}

.res{display:grid;grid-template-columns:2.6ch 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.res:first-of-type{border-top:0}
.res .r{font-family:var(--display);font-weight:700;font-style:italic;font-size:1.4rem;text-align:right;color:var(--gold)}
.res.hid .r{color:var(--muted)}
.res .n{font-weight:600} .res .w{font-size:.8rem;color:var(--muted)}
.res .p{font-family:var(--display);font-weight:700;font-size:1.35rem;text-align:right}
.rule{display:flex;flex-direction:column;gap:6px}
.rule .k{font-family:var(--display);font-style:italic;font-weight:700;font-size:1.25rem;text-transform:uppercase;border-bottom:3px solid var(--gold);align-self:flex-start;line-height:1.1}
.cotes{margin:8px 0 0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.cotes li{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 4px;font-size:.8rem;color:var(--muted);text-align:center;display:flex;flex-direction:column;gap:2px}
.cotes b{font-family:var(--display);font-size:1.35rem;color:var(--gold);line-height:1}
.conf{border-left:5px solid var(--red)}
.alert{display:flex;gap:10px;align-items:center;text-align:left;width:100%;background:rgba(229,72,77,.14);border:1px solid var(--red);border-radius:10px;padding:10px 12px;font-weight:600;font-size:.92rem}
.alert span{flex:1}
nav.bottom button{position:relative}
.dot{position:absolute;top:3px;left:calc(50% + 6px);background:var(--red);color:#fff;border-radius:99px;font-size:.62rem;min-width:16px;height:16px;display:grid;place-items:center;padding:0 4px;font-weight:700}
.chk{display:flex;gap:8px;align-items:center;font-size:.78rem;color:var(--muted);margin-top:6px}
.chk input{width:18px;height:18px;accent-color:var(--gold)}
@media (max-width:380px){.hero h1{font-size:2.3rem}}
.chartwrap{position:relative}
#chart{width:100%;height:auto;display:block;touch-action:pan-y;border-radius:8px}
#chart:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#chart .ax{fill:var(--muted);font-size:10px;font-family:var(--body)}
#chart .lab{fill:var(--text);font-size:11px;font-weight:600;font-family:var(--body)}
.tip{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:.85rem;margin-top:10px}
.steps{display:flex;align-items:center;gap:6px;margin-top:10px}
.steps .stepbtns{display:flex;flex:1;gap:3px}
.steps button{font:inherit;color:var(--text);background:var(--bg2);border:1px solid var(--line);border-radius:8px;min-height:40px;cursor:pointer;padding:0}
.steps .stepbtns button{flex:1;min-width:0;font-size:.8rem;font-variant-numeric:tabular-nums}
.steps .arr{width:40px;flex:none;font-size:.9rem}
.steps button[aria-pressed="true"]{background:var(--gold);color:#111;border-color:var(--gold);font-weight:700}
.steps button:disabled{opacity:.35;cursor:default}
.steps button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.steps-l{font-size:.75rem;color:var(--muted);margin-top:10px}
.tip .h{color:var(--muted);margin-bottom:4px}
.tip .r{display:flex;align-items:center;gap:8px;margin-top:3px}
.tip .k{width:14px;height:0;border-top:3px solid;border-radius:2px;flex:none}
.tip b{font-variant-numeric:tabular-nums;min-width:3.4em;text-align:right}
.tip .n{color:var(--muted)}
.legend2{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:.84rem}
.legend2 i{display:inline-block;width:14px;height:0;border-top:3px solid;border-radius:2px;margin-right:6px;vertical-align:middle}
details.tbl{margin-top:10px} details.tbl summary{cursor:pointer;color:var(--gold);font-weight:600;font-size:.88rem}
.tot .tt{display:block;font-family:var(--body);font-weight:500;font-size:.72rem;color:var(--muted);line-height:1.3;margin-top:2px}
.parts .sel dt,.parts .sel dd{color:var(--gold)}
.ex{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.9rem;margin-top:6px}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:99px;font-weight:600;font-size:.9rem;z-index:9}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .4s ease}}
.push{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:.92rem}.push .pt1{display:flex;justify-content:space-between;gap:8px;margin-bottom:3px}.push .pt1 span{color:var(--muted);font-size:.78rem}

header.top{padding-top:calc(10px + env(safe-area-inset-top))}
.legal{margin-top:6px;text-align:center}
.diag{padding:0;margin:0}.diag li{list-style:none;padding:8px 0;border-top:1px solid var(--line)}.diag li:first-child{border-top:0}
.okk b{color:var(--green)}.ko b{color:var(--red)}
.who2{padding:9px 0;border-top:1px solid var(--line)}.who2:first-child{border-top:0}
a.link{color:var(--gold)}
</style>
</head>

<div class="app" id="app"></div>

<script src="config.js"></script>
<script>
const SPORTS = {
  foot: ['⚽', 'Football'], tennis: ['🎾', 'Tennis'], basket: ['🏀', 'Basket'], rugby: ['🏉', 'Rugby'], athle: ['🏃', 'Athlétisme'],

  judo: ['🥋', 'Judo'], tt: ['🏓', 'Tennis de table'], voile: ['⛵', 'Voile'], gym: ['🤸', 'Gymnastique'], golf: ['⛳', 'Golf'], other: ['🏅', 'Autre sport']
};
const ATHLETES = [
  ["Tadej Pogačar", "velo"], ["Armand Duplantis", "athle"], ["Carlos Alcaraz", "tennis"], ["Jannik Sinner", "tennis"], ["Léon Marchand", "nat"], ["Novak Djokovic", "tennis"],
  ["Max Verstappen", "auto"], ["Simone Biles", "gym"], ["Sydney McLaughlin-Levrone", "athle"], ["Ousmane Dembélé", "foot"], ["Kylian Mbappé", "foot"], ["Erling Haaland", "foot"],
  ["Lionel Messi", "foot"], ["Stephen Curry", "basket"], ["Nikola Jokić", "basket"], ["Victor Wembanyama", "basket"], ["Teddy Riner", "judo"], ["Antoine Dupont", "rugby"],
  ["Marc Márquez", "auto"], ["Summer McIntosh", "nat"], ["Melissa Jefferson-Wooden", "athle"], ["Pauline Ferrand-Prévot", "velo"], ["Jimmy Gressier", "athle"], ["Félix Lebrun", "tt"],

/* ---------- Moteur de scoring ---------- */
const W = r => 19 - r;                               // poids d'un athlète selon son rang réel : 18 pour le 1er, 9 pour le 10e (le 1er vaut 2 fois le 10e)
const SNIPER = 40;                                   // maximum du Pifomètre : autant qu'un classement parfait à cote ×1 (4 pts × 10 athlètes)
const SMAX = 270;                                    // poids total des deux Top 10 (135 par classement)
const PREC = d => 1 - 0.1 * d;                       // justesse : -10 % par rang d'écart
const pts = d => d === 0 ? 4 : d === 1 ? 3 : 2;      // score de placement
const CHAMP = 4;                                     // bonus champion (x cote)
const norm = s => String(s || '').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[´'’`]/g, "'").replace(/\s+/g, ' ');
// ×2 si un seul joueur l'a, ×1 si tous l'ont, proportionnel entre les deux, arrondi à une décimale
const cote = (k, N) => N <= 1 ? 1 : Math.round(10 * Math.min(2, Math.max(1, 2 - (k - 1) / (N - 1)))) / 10;
const malus = N => N <= 2 ? 0 : N === 3 ? 2 : N === 4 ? 3 : 5;
const looserOn = (N, k) => N <= 2 ? false : (N <= 4 ? k === N - 1 : k >= 0.8 * N);
const CLS = [['monde', 'Monde'], ['france', 'France']];
const keyOf = (st, s) => { const x = norm(s); if (st.distinct && st.distinct[x]) return 'raw:' + String(s || '').trim().toLowerCase().replace(/\s+/g, ' '); return (st.aliases && st.aliases[x]) || x; };

/* Meilleur cas réaliste sur les rangs encore à dévoiler (1..m), avec les seuls athlètes du joueur pas encore tombés (positions free) :
   on couvre d'abord le plus de poids possible, puis on maximise la justesse. Retourne le poids ajouté, la justesse ajoutée et le nombre d'athlètes trouvés. */
function bestFill(free, m) {
  const P = free.length, size = 1 << P;
  let dp = new Float64Array(size).fill(-1), dw = new Float64Array(size), dq = new Float64Array(size); dp[0] = 0;
  for (let r = 1; r <= m; r++) {
    const nd = dp.slice(), nw = dw.slice(), nq = dq.slice();
    for (let mask = 0; mask < size; mask++) {
      if (dp[mask] < 0) continue;
      for (let j = 0; j < P; j++) {
        if (mask & (1 << j)) continue;
        const q = PREC(Math.abs(free[j] - (r - 1))), v = dp[mask] + 100 * W(r) + q, nm = mask | (1 << j);
        if (v > nd[nm] + 1e-9) { nd[nm] = v; nw[nm] = dw[mask] + W(r); nq[nm] = dq[mask] + q; }
      }
    }
    dp = nd; dw = nw; dq = nq;
  }
  let best = 0, bk = 0; for (let k = 0; k < size; k++) if (dp[k] > dp[best] + 1e-9) best = k;
  for (let j = 0; j < P; j++) if (best & (1 << j)) bk++;
  return { W: dw[best], Q: dq[best], k: bk };
}
const nOf = (nn, c) => typeof nn === 'number' ? nn : (nn[c] || 0);
function compute(st, nn, lg) {
  const cn = s => keyOf(st, s);
  const ids = lg.members, N = ids.length, res = {}, kAll = {};
  ids.forEach(p => res[p] = { cl: {} });
  for (const [c] of CLS) {
    const n = nOf(nn, c);
    const k = {};
    ids.forEach(p => new Set(st.picks[p][c].map(cn).filter(Boolean)).forEach(a => { k[a] = (k[a] || 0) + 1; }));
    kAll[c] = k;
    const actualRaw = st.actual[c], actual = actualRaw.map(cn), rev = {};
    for (let r = 10; r >= 11 - n && r >= 1; r--) if (actual[r - 1]) rev[actual[r - 1]] = r;
    ids.forEach(p => {
      const raw = st.picks[p][c], picks = raw.map(cn), first = {};
      picks.forEach((a, i) => { if (a && !(a in first)) first[a] = i; });
      let placement = 0, champion = 0, looser = 0, Wf = 0, Q = 0, nF = 0; const rows = [], misses = [];
      picks.forEach((a, i) => {
        const row = { i, name: raw[i] || '', status: 'pending' };
        if (!a) row.status = 'empty';
        else if (first[a] !== i) row.status = 'dup';
        else if (a in rev) {
          const r = rev[a], d = Math.abs(i - (r - 1)), b = pts(d), cc = cote(k[a], N);
          Object.assign(row, { status: 'hit', rank: r, d, base: b, cote: cc, pts: b * cc, k: k[a] });
          placement += b * cc; Wf += W(r); Q += PREC(d); nF += 1;
          if (r === 1 && i === 0) { champion += CHAMP * cc; row.champ = CHAMP * cc; }
        } else if (n === 10) row.status = 'out';
        rows.push(row);
      });
      for (let r = 10; r >= 11 - n && r >= 1; r--) {
        const a = actual[r - 1];
        if (a && !(a in first) && looserOn(N, k[a] || 0)) { misses.push({ name: actualRaw[r - 1], rank: r, k: k[a] || 0 }); }
      }
      const hits = rows.filter(x => x.status === 'hit');
      const stats = { revealed: n, found: hits.length, exact: hits.filter(x => x.d === 0).length, near: hits.filter(x => x.d === 1).length };
      const free = []; picks.forEach((a, i) => { if (a && first[a] === i && !(a in rev)) free.push(i); });
      const fill = bestFill(free, 10 - n);   // meilleur cas réaliste avec les athlètes que le joueur peut encore trouver
      res[p].cl[c] = { placement, champion, looser, Wf, Q, nF, fill, stats, rows, misses };
    });
  }
  ids.forEach(p => {
    const m = res[p].cl.monde, f = res[p].cl.france, Wf = m.Wf + f.Wf, Q = m.Q + f.Q, nF = m.nF + f.nF;
    // couverture : part pondérée des athlètes trouvés ; précision : placement moyen des athlètes trouvés (100 % = tous au bon rang)
    const Wpot = Wf + m.fill.W + f.fill.W, Qpot = Q + m.fill.Q + f.fill.Q, npot = nF + m.fill.k + f.fill.k;   // meilleur cas réaliste
    const cA = Wf / SMAX, pA = nF > 0 ? Q / nF : 0, cP = Wpot / SMAX, pP = npot > 0 ? Qpot / npot : 0;
    const sA = SNIPER * Math.pow(cA * pA, 2), sP = Math.max(sA, SNIPER * Math.pow(cP * pP, 2));
    const st = { revealed: m.stats.revealed + f.stats.revealed, found: m.stats.found + f.stats.found, exact: m.stats.exact + f.stats.exact, near: m.stats.near + f.stats.near };
    res[p].sniper = { acq: sA, pot: sP - sA, lost: SNIPER - sP, couv: { now: 100 * cA, max: 100 * cP }, prec: { now: 100 * pA, max: 100 * pP }, stats: st };
    res[p].monde = m.placement; res[p].france = f.placement;
    // looser : une seule fois, quel que soit le nombre d'athlètes manqués (imputé au premier athlète manqué)
    if (m.misses.length) { m.looser = -malus(N); m.misses[0].pays = true; } else if (f.misses.length) { f.looser = -malus(N); f.misses[0].pays = true; }
    res[p].champion = m.champion + f.champion; res[p].looser = m.looser + f.looser;
    res[p].total = m.placement + f.placement + res[p].champion + res[p].looser + res[p].sniper.acq;
  });
  return { res, N, k: kAll };
}

const MET = [['total', 'Total'], ['monde', 'Monde'], ['france', 'France'], ['sniper', 'Pifomètre']];
const mval = (r, m) => m === 'sniper' ? r.sniper.acq : r[m];
function ranking(st, nn, lg, m = 'total') {
  const sorter = r => (a, b) => mval(r[b], m) - mval(r[a], m) || lg.members.indexOf(a) - lg.members.indexOf(b);
  const cur = compute(st, nn, lg), order = lg.members.slice().sort(sorter(cur.res)), prev = {};
  const nm = nOf(nn, 'monde'), nf = nOf(nn, 'france');
  if (nm + nf > 0) { const pv = compute(st, { monde: Math.max(0, nm - 1), france: Math.max(0, nf - 1) }, lg); lg.members.slice().sort(sorter(pv.res)).forEach((p, i) => { prev[p] = i; }); }
  return { cur, order, prev };
}

/* Transforme ce que renvoie la base (ou la base simulée des tests) en état de l'application */
function buildState(snap, meId, prevLg) {
  const users = snap.profiles.map(p => ({ id: p.id, name: p.pseudo, role: p.role === 'gamemaster' ? 'admin' : 'member' }));
  const byId = {}; users.forEach(u => { byId[u.id] = u; });
  const picks = {}; users.forEach(u => { picks[u.id] = blank(); });
  /* slots : mes 15 tuiles par classement (10 du Top 10 + 5 de réserve), avec leur note perso. picks ne garde que le Top 10, seul compté. */
  const slots = { monde: Array.from({ length: SLOTS }, () => ({ n: '', t: '' })), france: Array.from({ length: SLOTS }, () => ({ n: '', t: '' })) };
  snap.picks.forEach(r => {
    if (r.pos <= 10 && picks[r.user_id]) picks[r.user_id][r.classement][r.pos - 1] = r.name;
    if (r.user_id === meId) slots[r.classement][r.pos - 1] = { n: r.name, t: r.note || '' };
  });
  const validated = {}; snap.status.forEach(s => { validated[s.user_id] = !!s.validated; });
  const actual = blank(); snap.reveals.forEach(r => { actual[r.classement][r.rank - 1] = r.name; });
  const aliases = {}, distinct = {}, notAlias = {};
  snap.rules.forEach(r => { if (r.kind === 'alias') aliases[r.k] = r.v; else if (r.kind === 'distinct') distinct[r.k] = true; else notAlias[r.k] = 1; });
  const sports = defaultSports(); snap.sports.forEach(s => { sports[s.key] = s.sport; });
  const leagues = snap.leagues.map(l => ({ id: l.id, name: l.name, code: l.code, owner: l.owner_id,
    members: snap.members.filter(m => m.league_id === l.id).map(m => m.user_id).filter(id => byId[id]) }));
  const mine = leagues.filter(l => l.members.includes(meId));
  return {
    me: meId, season: snap.season.id, seasonLabel: snap.season.label, closesAt: Date.parse(snap.season.closes_at), firstReveal: snap.season.first_reveal || '2026-12-22',
    users, picks, slots, validated, actual, aliases, distinct, notAlias, sports, leagues,

}

}
/* Rapprochements à valider AVANT de publier un athlète (avant la clôture, seuls les pronos visibles du gamemaster sont comparés) : pronos des joueurs dont le nom ressemble au nom saisi par le gamemaster (nom de famille seul, accents, fautes). */
function pubMatches(c, name, rank) {
  const A = String(name || '').trim(); if (!A) return [];
  const a = cn(A), an = norm(A), byName = {}, others = new Set(), out = [];
  STATE.actual[c].forEach((x, k) => { if (x && k + 1 !== rank) others.add(cn(x)); });
  STATE.users.forEach(u => (STATE.picks[u.id] ? STATE.picks[u.id][c] : []).forEach(P => { const pn = norm(P); if (!pn) return; (byName[pn] = byName[pn] || { raw: P, users: new Set() }).users.add(u.name); }));
  Object.entries(byName).forEach(([pn, o]) => {

    if (cn(o.raw) === a || others.has(cn(o.raw)) || STATE.notAlias[key] || !similar(pn, an)) return;

/* Rapprochements à valider = ceux du nom saisi ET ceux de l'orthographe retenue (aucun ne peut être contourné). */
function pubAll(c, typed, spell, rank) {

const pubDefault = (name, ms) => ms.reduce((best, m) => toks(m.pick).length > toks(best).length ? m.pick : best, name);

function nameClusters() {
  if (!locked()) return [];   /* les gamemasters ne voient les pronos qu'après la clôture */
  const nodes = {};
  STATE.users.forEach(u => CLS.forEach(([c]) => (STATE.picks[u.id] ? STATE.picks[u.id][c] : []).forEach(raw => {
    const r = String(raw || '').trim(); if (!r) return;
    const k = cn(r), n = nodes[k] = nodes[k] || { k, raws: new Map() };
    if (!n.raws.has(r)) n.raws.set(r, new Set()); n.raws.get(r).add(u.name);
  })));
  const keys = Object.keys(nodes), parent = {}; keys.forEach(k => { parent[k] = k; });
  const find = k => parent[k] === k ? k : (parent[k] = find(parent[k]));
  for (let i = 0; i < keys.length; i++) for (let j = i + 1; j < keys.length; j++) {
    if (!STATE.notAlias['pp|' + [keys[i], keys[j]].sort().join('|')] && similar(keys[i], keys[j])) parent[find(keys[i])] = find(keys[j]);
  }
  const groups = {}; keys.forEach(k => { (groups[find(k)] = groups[find(k)] || []).push(k); });
  return Object.values(groups).map(g => {
    const variants = []; g.forEach(k => nodes[k].raws.forEach((users, raw) => variants.push({ raw, users: [...users] })));
    variants.sort((a, b) => b.users.length - a.users.length || b.raw.length - a.raw.length);
    const known = new Set(ATHLETES.map(x => x[0])), ok = variants.find(v => known.has(v.raw));
    return { keys: g, variants, suggest: (ok || variants[0]).raw };
  }).filter(c => c.variants.length > 1);
}

/* ---------- Accès à la base (Supabase) : appels de fonctions, sans bibliothèque externe ---------- */
function makeSupabaseApi(cfg) {
  const base = String(cfg.SUPABASE_URL).replace(/\/+$/, '') + '/rest/v1/rpc/';
  const headers = { 'Content-Type': 'application/json', apikey: cfg.SUPABASE_ANON_KEY };
  if (/^eyJ/.test(cfg.SUPABASE_ANON_KEY)) headers.Authorization = 'Bearer ' + cfg.SUPABASE_ANON_KEY;
  const KEY = 'classement_eurosport_token';
  let token = null, uid = null;
  /* Le jeton est gardé à deux endroits (stockage local + cookie d'un an) et le navigateur est invité à ne pas les purger :
     la connexion survit ainsi aux fermetures de l'app et aux nettoyages automatiques. */
  const readCookie = () => { try { const m = document.cookie.match(new RegExp('(?:^|; )' + KEY + '=([^;]*)')); return m ? decodeURIComponent(m[1]) : null; } catch (_) { return null; } };
  const writeCookie = t => { try { document.cookie = KEY + '=' + (t ? encodeURIComponent(t) : '') + '; path=/; max-age=' + (t ? 31536000 : 0) + '; SameSite=Lax' + (location.protocol === 'https:' ? '; Secure' : ''); } catch (_) { /* ignore */ } };
  try { token = localStorage.getItem(KEY); } catch (_) { /* stockage indisponible */ }
  if (!token) token = readCookie();
  const setToken = t => {
    token = t; writeCookie(t);
    try { if (t) localStorage.setItem(KEY, t); else localStorage.removeItem(KEY); } catch (_) { /* ignore */ }
    try { if (t && navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (_) { /* ignore */ }
  };
  if (token) setToken(token);   // recopie le jeton aux deux endroits
  async function rpc(fn, args) {
    let res;
    try { res = await fetch(base + fn, { method: 'POST', headers, body: JSON.stringify(args || {}) }); }
    catch (e) { throw new Error('Failed to fetch'); }
    const text = await res.text(); let body = null; try { body = text ? JSON.parse(text) : null; } catch (_) { /* corps non JSON */ }
    if (!res.ok) { const e = new Error((body && (body.message || body.hint)) || ('HTTP ' + res.status)); e.status = res.status; throw e; }
    return body;
  }
  return {
    userId: () => uid,
    async init() { return token ? { token } : null; },
    pseudoAvailable: p => rpc('pseudo_available', { p_pseudo: p }),
    async signUp(pseudo, code) { const r = await rpc('register', { p_pseudo: pseudo, p_code: code }); setToken(r.token); uid = r.me.id; },
    async signIn(pseudo, code) {
      const r = await rpc('login', { p_pseudo: pseudo, p_code: code });
      if (!r.ok) throw new Error(r.error === 'locked' ? 'locked:' + r.retry_in : r.error);
      setToken(r.token); uid = r.me.id;
    },
    async signOut() { const t = token; setToken(null); uid = null; if (t) { try { await rpc('logout', { p_token: t }); } catch (_) { /* ignore */ } } },
    serverInfo: () => rpc('server_info'),
    async snapshot() { const s = await rpc('snapshot', { p_token: token }); uid = s.me.id; return s; },
    savePicks: (season, data, validate) => rpc('save_picks', { p_token: token, p_season: season, p_data: data, p_validate: !!validate }),
    createLeague: (season, name) => rpc('create_league', { p_token: token, p_season: season, p_name: name }),
    joinLeague: code => rpc('join_league', { p_token: token, p_code: code }),
    leaveLeague: id => rpc('leave_league', { p_token: token, p_league: id }),
    renameLeague: (id, name) => rpc('rename_league', { p_token: token, p_league: id, p_name: name }),
    removeMember: (league, userId) => rpc('remove_member', { p_token: token, p_league: league, p_user: userId }),
    deleteLeague: id => rpc('delete_league', { p_token: token, p_league: id }),
    setReveal: (season, c, rank, name) => rpc('set_reveal', { p_token: token, p_season: season, p_classement: c, p_rank: rank, p_name: name }),
    setSport: (key, sport) => rpc('set_sport', { p_token: token, p_key: key, p_sport: sport }),
    applySpelling: (season, variants, spelling, rules) => rpc('gm_apply_spelling', { p_token: token, p_season: season, p_variants: variants, p_spelling: spelling, p_rules: rules }),
    setRules: (season, rules) => rpc('gm_set_rules', { p_token: token, p_season: season, p_rules: rules }),
    setRole: (userId, role) => rpc('set_role', { p_token: token, p_user: userId, p_role: role }),
    resetPassword: (userId, code) => rpc('admin_reset_password', { p_token: token, p_user: userId, p_new: code }),
    changePseudo: p => rpc('change_pseudo', { p_token: token, p_pseudo: p }),
    async changeCode(oldCode, newCode) { const r = await rpc('change_code', { p_token: token, p_old: oldCode, p_new: newCode }); if (!r.ok) throw new Error(r.error); },
    pushSubscribe: (endpoint, p256dh, auth) => rpc('push_subscribe', { p_token: token, p_endpoint: endpoint, p_p256dh: p256dh, p_auth: auth }),
    pushUnsubscribe: endpoint => rpc('push_unsubscribe', { p_token: token, p_endpoint: endpoint }),
    /* Réveille la fonction serveur d'envoi des notifications (sans erreur bloquante : le jeu fonctionne sans elle) */
    async notify(extra) {
      const url = cfg.FUNCTIONS_URL || (String(cfg.SUPABASE_URL).replace(/\/+$/, '') + '/functions/v1/notify');
      try { const r = await fetch(url, { method: 'POST', headers, body: JSON.stringify(Object.assign({ token }, extra || {})) }); return await r.json(); }
      catch (_) { return { ok: false, error: 'network' }; }
    },
    async deleteAccount() { await rpc('delete_my_account', { p_token: token }); setToken(null); uid = null; }
  };
}

const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;

async function pushEnable() {

}
